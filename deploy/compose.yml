services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      CONSOLE_DOMAIN: ${CONSOLE_DOMAIN:?set CONSOLE_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - console

  console:
    image: ghcr.io/bhagyajitjagdev/livekit-console:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # Caddy terminates TLS in front, so the session cookie can be Secure.
      SESSION_SECURE: "true"
    # Deliberately not published to the host — reachable only through Caddy.
    expose:
      - "8000"

volumes:
  caddy-data:
  caddy-config:
